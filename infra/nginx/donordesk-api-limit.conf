# Public API rate limit: per API key (Authorization header), else per client address.
map $http_authorization $dd_api_key { default $http_authorization; "" $binary_remote_addr; }
limit_req_zone $dd_api_key zone=dd_public_api:10m rate=10r/s;
limit_req_status 429;
# Public collection links: answers from anyone holding a link, limited per address.
limit_req_zone $binary_remote_addr zone=dd_public_collect:10m rate=5r/s;
# Public dashboard pages read the database on every view: limited per address.
limit_req_zone $binary_remote_addr zone=dd_public_dashboards:10m rate=5r/s;
