################################################################################
# DonorDesk API Service
################################################################################

apiVersion: v1
kind: Service
metadata:
  name: {{ include "donordesk-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "donordesk-api.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.multiRegion.enabled }}
    cloud.google.com/backend-config: '{"default": "{{ include "donordesk-api.fullname" . }}"}'
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "donordesk-api.selectorLabels" . | nindent 4 }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
