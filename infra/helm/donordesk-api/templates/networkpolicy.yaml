################################################################################
# Network Policy - Default Deny + Allowlist
################################################################################

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "donordesk-api.fullname" . }}-default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "donordesk-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "donordesk-api.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
          podSelector:
            matchLabels:
              app: ingress-nginx
        - podSelector:
            matchLabels:
              app: donordesk-web
        - podSelector:
            matchLabels:
              app: donordesk-worker
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 443   # HTTPS
        - protocol: UDP
          port: 53    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
{{- end }}
