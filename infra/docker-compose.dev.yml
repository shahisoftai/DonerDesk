name: donordesk

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: donordesk
      POSTGRES_USER: donordesk
      POSTGRES_PASSWORD: donordesk-dev
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donordesk -d donordesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8081:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  kestra:
    image: kestra/kestra:latest-lts
    command: ["server", "local"]
    user: root
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          tutorialFlows:
            enabled: false
          server:
            basicAuth:
              enabled: true
              username: admin@donordesk.local
              password: DonorDesk123
    ports: ["8080:8080"]
    volumes:
      - kestra_data:/app/storage
      - kestra_db:/app/data
      - ../workflows/kestra:/app/flows:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["3200:3200", "4317:4317", "4318:4318"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on: [prometheus, tempo, loki]

volumes:
  postgres_data:
  kestra_data:
  kestra_db:
  tempo_data:
