# Kestra flow: ingest evidence from a Google Drive folder (reference-only).
#
# On a new file in the configured folder, this flow REFERENCENCES the file by its
# Drive id (it does NOT download or copy the bytes into DonorDesk). It calls the
# signed /internal/evidence/upload route with driveFileId + metadata; the file
# stays in the tenant's Google Drive. The upload publishes an EvidenceUploaded
# event which the outbox maps to the evidence.suggest_tags job for downstream
# tagging (Google OCR by file ID).
#
# GATED: requires a Google service account configured in the SuperAdmin portal
# (CONNECTOR provider "google-drive") and its JSON materialized in the Kestra
# secret store as GDRIVE_SERVICE_ACCOUNT_JSON, plus GDRIVE_FOLDER_ID. Until those
# credentials are provisioned and the connection is tested, this flow is staged
# but not operational (do not mark it enabled in the portal).
id: gdrive_ingest
namespace: donor_desk.phase1
description: Ingest evidence from a Google Drive folder into DonorDesk (reference-only).
inputs:
  - id: tenantId
    type: STRING
  - id: projectId
    type: STRING
  - id: evidenceType
    type: STRING
    defaults: OTHER
  - id: confidentialityLevel
    type: STRING
    defaults: INTERNAL
tasks:
  - id: ingest
    type: io.kestra.plugin.google.drive.Trigger
    folder: "{{ secret('GDRIVE_FOLDER_ID') }}"
    serviceAccount: "{{ secret('GDRIVE_SERVICE_ACCOUNT_JSON') }}"

  - id: reference
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    packageManager: PIP
    script: |
      import base64
      import hashlib
      import hmac
      import json
      import time
      import urllib.request

      token = "{{ secret('KESTRA_API_INTERNAL_TOKEN') }}"
      hmac_secret = "{{ secret('KESTRA_HMAC_SECRET') }}"
      api_url = "{{ secret('DONORDESK_API') }}"
      tenant = "{{ inputs.tenantId }}"
      file_id = "{{ outputs.ingest.fileId | default(outputs.ingest.id | default('')) }}"
      file_name = "{{ outputs.ingest.name | default('inbound') }}"

      # Reference-only: send the Drive file id, never the bytes. The file stays
      # in the tenant's Drive; DonorDesk grants read access and records the link.
      body = json.dumps(
          {
              "projectId": "{{ inputs.projectId }}",
              "title": file_name,
              "fileName": file_name,
              "fileType": "application/octet-stream",
              "evidenceType": "{{ inputs.evidenceType }}",
              "confidentialityLevel": "{{ inputs.confidentialityLevel }}",
              "driveFileId": file_id,
          },
          separators=(",", ":"),
      )
      method = "POST"
      path_route = "/internal/evidence/upload"
      timestamp = str(int(time.time()))
      canonical = "\n".join([method, path_route, tenant, timestamp, body])
      signature = base64.b64encode(
          hmac.new(hmac_secret.encode(), canonical.encode(), hashlib.sha256).digest()
      ).decode()
      request = urllib.request.Request(
          api_url + path_route,
          data=body.encode(),
          method=method,
          headers={
              "Content-Type": "application/json",
              "x-internal-token": token,
              "x-tenant-id": tenant,
              "x-internal-timestamp": timestamp,
              "x-internal-signature": signature,
          },
      )
      with urllib.request.urlopen(request) as response:
          print(response.read().decode())
