# Kestra flow: parse a real evidence file with the free Tika plugin, then tag it.
#
# This upgrades the original evidence_ingest flow so the worker receives the
# ACTUAL extracted document text (via Apache Tika) instead of only the metadata
# title/notes. The flow:
#   1. fetch_content — signs a GET /internal/evidence/:id/content request, streams
#      the uploaded bytes into Kestra storage (outputFiles).
#   2. extract_text — runs io.kestra.plugin.tika.Parse (OCR/text extraction).
#   3. suggest_and_persist — calls the workers /v1/suggest-tags with the real text
#      and persists the result via the signed /internal/evidence/:id/tags route.
#
# Secrets: KESTRA_API_INTERNAL_TOKEN, KESTRA_HMAC_SECRET, KESTRA_WORKERS_INTERNAL_TOKEN,
# DONORDESK_API, DONORDESK_WORKERS (set in the Kestra secret store; validated against
# the pinned Kestra version in Phase E).
id: evidence_parse
namespace: donor_desk.phase1
description: Parse evidence bytes with Tika and suggest tags from the real document text.
inputs:
  - id: evidenceId
    type: STRING
  - id: tenantId
    type: STRING
tasks:
  - id: fetch_content
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    packageManager: PIP
    outputFiles:
      - evidence.bin
    script: |
      import base64
      import hashlib
      import hmac
      import os
      import time
      import urllib.request

      token = "{{ secret('KESTRA_API_INTERNAL_TOKEN') }}"
      hmac_secret = "{{ secret('KESTRA_HMAC_SECRET') }}"
      api_url = "{{ secret('DONORDESK_API') }}"
      tenant = "{{ inputs.tenantId }}"
      evidence_id = "{{ inputs.evidenceId }}"
      method = "GET"
      path = f"/internal/evidence/{evidence_id}/content"
      timestamp = str(int(time.time()))
      canonical = "\n".join([method, path, tenant, timestamp, ""])
      signature = base64.b64encode(
          hmac.new(hmac_secret.encode(), canonical.encode(), hashlib.sha256).digest()
      ).decode()
      request = urllib.request.Request(
          api_url + path,
          method=method,
          headers={
              "x-internal-token": token,
              "x-tenant-id": tenant,
              "x-internal-timestamp": timestamp,
              "x-internal-signature": signature,
          },
      )
      with urllib.request.urlopen(request) as response:
          data = response.read()
      out = os.path.join(os.environ.get("WORKDIR", "."), "evidence.bin")
      with open(out, "wb") as handle:
          handle.write(data)
      print(f"Downloaded {len(data)} bytes")

  - id: extract_text
    type: io.kestra.plugin.tika.Parse
    from: "{{ outputs.fetch_content.files['evidence.bin'] }}"

  - id: suggest_and_persist
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    packageManager: PIP
    env:
      EXTRACTED_TEXT: "{{ outputs.extract_text.text | default('') }}"
    script: |
      import base64
      import hashlib
      import hmac
      import json
      import os
      import time
      import urllib.request

      api_token = "{{ secret('KESTRA_API_INTERNAL_TOKEN') }}"
      workers_token = "{{ secret('KESTRA_WORKERS_INTERNAL_TOKEN') }}"
      hmac_secret = "{{ secret('KESTRA_HMAC_SECRET') }}"
      api_url = "{{ secret('DONORDESK_API') }}"
      workers_url = "{{ secret('DONORDESK_WORKERS') }}"
      tenant = "{{ inputs.tenantId }}"
      evidence_id = "{{ inputs.evidenceId }}"
      extracted_text = os.environ.get("EXTRACTED_TEXT", "")

      def signed_request(method, path, body=""):
          timestamp = str(int(time.time()))
          canonical = "\n".join([method, path, tenant, timestamp, body])
          signature = base64.b64encode(
              hmac.new(hmac_secret.encode(), canonical.encode(), hashlib.sha256).digest()
          ).decode()
          return urllib.request.Request(
              api_url + path,
              data=body.encode() if body else None,
              method=method,
              headers={
                  "Content-Type": "application/json",
                  "x-internal-token": api_token,
                  "x-tenant-id": tenant,
                  "x-internal-timestamp": timestamp,
                  "x-internal-signature": signature,
              },
          )

      metadata_path = f"/internal/evidence/{evidence_id}"
      with urllib.request.urlopen(signed_request("GET", metadata_path)) as response:
          evidence = json.loads(response.read())

      worker_body = json.dumps(
          {
              "file_name": evidence["fileName"],
              "file_type": evidence["fileType"],
              "extracted_text": extracted_text,
          },
          separators=(",", ":"),
      )
      worker_request = urllib.request.Request(
          workers_url + "/v1/suggest-tags",
          data=worker_body.encode(),
          method="POST",
          headers={"Content-Type": "application/json", "x-internal-token": workers_token},
      )
      with urllib.request.urlopen(worker_request) as response:
          suggestion = json.loads(response.read())

      suggestion["idempotencyKey"] = hashlib.sha256(
          f"{tenant}:evidence.suggest_tags:{evidence_id}:{worker_body}".encode()
      ).hexdigest()
      persist_body = json.dumps(suggestion, separators=(",", ":"))
      persist_path = f"/internal/evidence/{evidence_id}/tags"
      with urllib.request.urlopen(signed_request("POST", persist_path, persist_body)) as response:
          print(response.read().decode())
