id: report_draft_section
namespace: donor_desk.phase1
description: Draft a report section through the authenticated DonorDesk worker.
inputs:
  - id: payload
    type: JSON
tasks:
  - id: draft
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('DONORDESK_WORKERS') }}/v1/draft-section"
    method: POST
    contentType: application/json
    headers:
      X-Internal-Token: "{{ secret('KESTRA_WORKERS_INTERNAL_TOKEN') }}"
    body: "{{ inputs.payload }}"
