# Kestra flow: ingest evidence from an SFTP drop folder (free SFTP plugin).
#
# Polls an SFTP directory; each new file is downloaded and uploaded into
# DonorDesk through the signed /internal/evidence/upload route, which then
# triggers the evidence.suggest_tags job for downstream parsing/tagging.
#
# GATED: requires SFTP credentials (SFTP_HOST, SFTP_PORT, SFTP_USERNAME,
# SFTP_PASSWORD, SFTP_DIR) in the Kestra secret store. Until provisioned and the
# connection is tested, this flow is staged but not operational.
id: sftp_ingest
namespace: donor_desk.phase1
description: Ingest evidence from an SFTP drop folder into DonorDesk.
inputs:
  - id: tenantId
    type: STRING
  - id: projectId
    type: STRING
  - id: evidenceType
    type: STRING
    defaults: OTHER
  - id: confidentialityLevel
    type: STRING
    defaults: INTERNAL
tasks:
  - id: ingest
    type: io.kestra.plugin.fs.sftp.Trigger
    host: "{{ secret('SFTP_HOST') }}"
    port: "{{ secret('SFTP_PORT') }}"
    username: "{{ secret('SFTP_USERNAME') }}"
    password: "{{ secret('SFTP_PASSWORD') }}"
    dir: "{{ secret('SFTP_DIR') }}"

  - id: upload
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    packageManager: PIP
    inputFiles:
      inbound: "{{ outputs.ingest.uri }}"
    script: |
      import base64
      import hashlib
      import hmac
      import json
      import os
      import time
      import urllib.request

      token = "{{ secret('KESTRA_API_INTERNAL_TOKEN') }}"
      hmac_secret = "{{ secret('KESTRA_HMAC_SECRET') }}"
      api_url = "{{ secret('DONORDESK_API') }}"
      tenant = "{{ inputs.tenantId }}"

      file_name = "{{ outputs.ingest.name | default('inbound') }}"
      path = os.path.join(os.environ.get("WORKDIR", "."), "inbound")
      with open(path, "rb") as handle:
          raw = handle.read()

      body = json.dumps(
          {
              "projectId": "{{ inputs.projectId }}",
              "title": file_name,
              "fileName": file_name,
              "fileType": "application/octet-stream",
              "evidenceType": "{{ inputs.evidenceType }}",
              "confidentialityLevel": "{{ inputs.confidentialityLevel }}",
              "fileBase64": base64.b64encode(raw).decode(),
          },
          separators=(",", ":"),
      )
      method = "POST"
      path_route = "/internal/evidence/upload"
      timestamp = str(int(time.time()))
      canonical = "\n".join([method, path_route, tenant, timestamp, body])
      signature = base64.b64encode(
          hmac.new(hmac_secret.encode(), canonical.encode(), hashlib.sha256).digest()
      ).decode()
      request = urllib.request.Request(
          api_url + path_route,
          data=body.encode(),
          method=method,
          headers={
              "Content-Type": "application/json",
              "x-internal-token": token,
              "x-tenant-id": tenant,
              "x-internal-timestamp": timestamp,
              "x-internal-signature": signature,
          },
      )
      with urllib.request.urlopen(request) as response:
          print(response.read().decode())
